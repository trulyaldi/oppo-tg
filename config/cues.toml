# One cue file for the whole bot (D-257, KF-05). Edit here; no code change needed.
#
# Layout: category -> (name) -> language lists en / ru / kk. Any list may be empty.
#
# Entry syntax (matching is on NFKC case-folded text with e-diaeresis folded to e):
#   word or phrase   whole-word match at both ends; spaces in a phrase match spaces or hyphens
#   stem*            prefix match (Russian and Kazakh inflection)
#   re:<regex>       raw regex over the folded text (write the boundaries yourself)
# Entries of 3 characters or fewer (ai, ml, qa, c++) are always whole-word; "ai*" is a load error.
#
# Positive cues are [types.*] and [fields.*]. They were reviewed for false positives:
# bare "engineer", "sales*", "quant*", "modeling", "старш*" and "физик*" are deliberately absent
# (salesforce, quantity, fashion modeling, старшеклассник, физическое лицо).

