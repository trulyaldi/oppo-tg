# ---------------------------------------------------------------- hh.kz queries (KF-20)
# One request per group per run: an OR query of up to max_terms_per_query plain terms (stems and
# regexes are skipped) taken round-robin across en, ru and kk. Groups rotate across runs and at
# most max_requests_per_run requests are sent per run. area 40 is set in config.toml.

[hh]
groups = [
  "types.internship", "fields.ml", "fields.data_science", "fields.quant", "fields.analytics",
  "types.junior",
]
max_terms_per_query = 12
max_requests_per_run = 4

