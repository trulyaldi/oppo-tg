# Non-secret, user-editable configuration (D-06). Secrets live in .env.

[sources.greenhouse]
enabled = true
# Greenhouse board tokens (boards-api.greenhouse.io/v1/boards/<token>/jobs)
boards = [
  "anthropic", "databricks", "stripe", "janestreet",
  "imc", "jumptrading", "drweng", "scaleai",
]

[sources.greenhouse.names]
anthropic = "Anthropic"
databricks = "Databricks"
stripe = "Stripe"
janestreet = "Jane Street"
imc = "IMC Trading"
jumptrading = "Jump Trading"
drweng = "DRW"
scaleai = "Scale AI"

[sources.lever]
enabled = true
# Lever company slugs (api.lever.co/v0/postings/<slug>)
companies = ["palantir", "spotify", "weride"]

[sources.lever.names]
palantir = "Palantir"
spotify = "Spotify"
weride = "WeRide"

[sources.ashby]
enabled = true
boards = []

[sources.hn]
enabled = true

[sources.hh]
enabled = true
area = 40 # Kazakhstan
queries = ["data scientist", "machine learning", "intern analyst"]

[sources.rss]
enabled = true
feeds = []

[sources.pagewatch]
enabled = true
urls = []

[sources.devpost]
enabled = true

[sources.mlh]
enabled = true

[sources.kaggle]
enabled = true
categories = ["featured", "research"]

[sources.telegram_channels]
enabled = true
channels = []

[sources.yc]
enabled = true

[filters]
positive_title_keywords = [
  "intern", "quant", "research", "data", "ml", "machine learning", "ai",
  "scientist", "analyst", "engineer", "developer", "trader",
]
spam_keywords = ["crypto airdrop", "get rich", "mlm", "pyramid"]
unpaid_keywords = ["unpaid", "no compensation", "volunteer only"]
senior_only_keywords = ["senior", "staff", "principal", "director", "head of", "lead"]
max_age_days = 60

[thresholds]
digest_min_score = 5.0
digest_max_items = 10
digest_min_items = 5
alert_score = 9.0
alert_deadline_days = 7
alert_deadline_min_score = 0.0
