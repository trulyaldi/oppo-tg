# Non-secret, user-editable configuration (D-06). Secrets live in .env.

[sources.greenhouse]
enabled = true
# Greenhouse board tokens (boards-api.greenhouse.io/v1/boards/<token>/jobs)
boards = [
  "anthropic", "databricks", "stripe", "janestreet",
  "imc", "jumptrading", "drweng", "scaleai",
]

[sources.greenhouse.names]
anthropic = "Anthropic"
databricks = "Databricks"
stripe = "Stripe"
janestreet = "Jane Street"
imc = "IMC Trading"
jumptrading = "Jump Trading"
drweng = "DRW"
scaleai = "Scale AI"

[sources.lever]
enabled = true
# Lever company slugs (api.lever.co/v0/postings/<slug>)
companies = ["palantir", "spotify", "weride"]

[sources.lever.names]
palantir = "Palantir"
spotify = "Spotify"
weride = "WeRide"

[sources.ashby]
enabled = true
# Ashby board names (api.ashbyhq.com/posting-api/job-board/<name>)
boards = ["cohere", "perplexity", "ramp"]

[sources.ashby.names]
cohere = "Cohere"
perplexity = "Perplexity"
ramp = "Ramp"

[sources.workable]
enabled = true
# Workable account slugs (www.workable.com/api/accounts/<slug>); discovered boards add more
accounts = []

[sources.workable.names]

[sources.hn]
enabled = true

[sources.hh]
enabled = true
area = 40 # Kazakhstan
period = 14 # days
region_hint = "kz" # D-194: unknown-region employers on hh.kz count as KZ
queries = [
  "data scientist", "machine learning", "quant",
  "аналитик данных стажер", "стажировка python",
]

[sources.rss]
enabled = true

[[sources.rss.feeds]]
url = "https://hnrss.org/jobs"
name = "HN Jobs"
kind = "job"

[[sources.rss.feeds]]
url = "https://www.nsf.gov/rss/rss_www_funding-upcoming/rss.xml"
name = "NSF Upcoming Due Dates"
kind = "research"

[sources.pagewatch]
enabled = true

[[sources.pagewatch.pages]]
url = "https://www.imc.com/eu/careers/"
name = "IMC Careers"
company = "IMC"
kind = "internship"

[[sources.pagewatch.pages]]
url = "https://www.optiver.com/join-us/jobs/"
name = "Optiver Jobs"
company = "Optiver"
kind = "internship"

[[sources.pagewatch.pages]]
url = "https://www.janestreet.com/join-jane-street/internships/"
name = "Jane Street Internships"
company = "Jane Street"
kind = "internship"

[[sources.pagewatch.pages]]
url = "https://home.cern/summer-student-programme"
name = "CERN Summer Student Programme"
company = "CERN"
kind = "research"

[[sources.pagewatch.pages]]
url = "https://summer.epfl.ch/"
name = "Summer@EPFL"
company = "EPFL"
kind = "research"

[[sources.pagewatch.pages]]
url = "https://inf.ethz.ch/studies/summer-research-fellowship.html"
name = "ETH Student Summer Research Fellowship"
company = "ETH Zurich"
kind = "fellowship"

[[sources.pagewatch.pages]]
url = "https://www.oist.jp/admissions/research-internship/apply-research-internship"
name = "OIST Research Internship"
company = "OIST"
kind = "research"

[sources.devpost]
# Disabled: Devpost ToS forbids automated access (D-50)
enabled = false

[sources.mlh]
enabled = true

[sources.jobicy]
enabled = true
# industry slugs from /api/jobs?get=industries; optional extra `tags` queries
industries = ["data-science", "engineering"]
tags = []

[sources.remoteok]
# https://remoteok.com/api, one GET per run, at most hourly (D-178). Items link to the Remote OK
# job page and say "via Remote OK" (D-191). Optional local filter: keep jobs with any of these tags.
enabled = true
tier = "tier2"
tags = []

[sources.yc]
# dropped: YC terms forbid scraping (D-54)
enabled = false

[sources.euraxess]
enabled = false  # dropped: WAF returns 403 for query-string requests (D-59)

[sources.kaggle]
# dropped: Kaggle terms page unreadable, so no fetching code (D-68)
enabled = false

[sources.telegram_channels]
enabled = true
# Public channel handles, e.g. ["some_channel"]. Empty until you fill it in (D-69).
channels = []
# Live listening (D-193): messages from channels the account has joined arrive at once;
# the rest stay on polling. Joining is a user action, so auto_join is false.
live_flush_s = 30
auto_join = false
region_hint = "kz" # D-194

[filters]
positive_title_keywords = [
  "intern", "quant", "research", "data", "ml", "machine learning", "ai",
  "scientist", "analyst", "engineer", "developer", "trader",
  # Russian stems (prefix match): analyst, data, engineer, developer, programmer,
  # researcher, scientist, trader, machine, intern(ship), quant
  "аналитик", "данны", "инженер", "разработчик", "программист", "исследовател",
  "учены", "учёны", "трейдер", "машинн", "стаж", "квант",
]
spam_keywords = ["crypto airdrop", "get rich", "mlm", "pyramid"]
unpaid_keywords = ["unpaid", "no compensation", "volunteer only"]
senior_only_keywords = [
  "senior", "staff", "principal", "director", "head of", "lead", "sr",
  # Russian seniority stems (prefix match): senior, leading, head, chief, director
  "старш", "ведущ", "руководител", "главн", "директор",
]
max_age_days = 60
# D-195: work-authorization blockers (phrase match in title+description). "lower" flags and
# penalizes the adjusted score, never alerts; "filter" drops the posting before triage.
hard_blocker_keywords = [
  "citizens only", "citizenship required", "security clearance", "ts/sci",
  "active clearance", "polygraph",
]
hard_blocker_action = "lower"  # lower | filter
hard_blocker_penalty = 2.0
# D-195: phrases that filter job/internship titles as negative_title unless a protect keyword
# matches. Bare "finance" is excluded (it would kill quant-finance titles).
negative_title_keywords = [
  "solutions engineer", "support engineer", "sales engineer", "recruiter", "recruiting",
  "legal counsel", "product designer", "ux designer", "finance operations", "sales",
  "account manager", "customer success", "paralegal", "accountant",
]
protect_title_keywords = [
  "quant", "quantitative", "machine learning", "research scientist", "data scientist",
]

[thresholds]
digest_min_score = 5.0
alert_score = 9.0
alert_deadline_days = 7
alert_deadline_min_score = 0.0
fresh_alert_score = 7.5     # base score needed for a fresh alert (D-189)
fresh_alert_max_per_day = 5 # fresh alerts per Asia/Almaty day
fresh_window_hours = 48     # an item is fresh for this long after first_seen_at
digest_score_band = 1.0     # digest ranks by band = floor(score / this), then freshness

[scheduler]
tier1_minutes = 15          # watchlist boards
tier2_minutes = 90          # discovered boards, aggregators, feeds, hh, channels
tier3_minutes = 60          # pagewatch pages
tier1_jitter_s = 60
tier2_jitter_s = 300
tier3_jitter_s = 300
no_validator_min_minutes = 60  # tier1 hosts without ETag/Last-Modified

[discovery]
enabled = true
boards_file = "data/discovered_boards.toml"  # runtime data, gitignored
max_validations_per_day = 40
max_new_boards_per_day = 20
negative_cache_days = 30
run_time = "05:30"                           # Asia/Almaty

[politeness]
default_min_interval_s = 2.0
jitter_fraction = 0.25      # added to the interval, never subtracted; at most 1
max_concurrent_requests = 4
backoff_base_s = 300
backoff_max_s = 21600

[politeness.hosts]
# host suffix = minimum seconds between requests, e.g. "example.com" = 5.0
"remoteok.com" = 5.0

[ranking]
weights_file = "config/weights.yaml"

[scoring]
daily_call_cap = 200       # all scoring calls per Asia/Almaty day, retries included; 0 = no scoring
baseline_max_share = 0.5   # baseline postings may use at most this share of the cap

[triage]
# Cheap relevance pass before full scoring (D-196). A "no" never reaches the scorer.
enabled = true
model = "claude-haiku-4-5"     # D-183
max_desc_chars = 500           # description characters sent to the model
daily_call_cap = 600           # triage calls per Asia/Almaty day, retries included; must be >= 1 while enabled (enabled = false skips triage)
baseline_max_share = 0.5       # baseline postings may use at most this share of the cap
exempt_sources = ["pagewatch"] # hand-curated pages skip triage

[outreach]
cheap_model = "claude-haiku-4-5"     # CV parsing, pasted-contact extraction
tailor_model = "claude-sonnet-4-6"   # /prepare and /draft
daily_llm_call_cap = 40              # all outreach calls per Asia/Almaty day, retries included
max_page_fetches_per_prepare = 2
max_page_fetches_per_day = 20
max_contacts_per_posting = 10
contact_ttl_days = 60
rediscover_after_days = 7
cv_max_bytes = 5000000
cv_max_pages = 20
cv_max_chars = 30000
pending_input_minutes = 15
